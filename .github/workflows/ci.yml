# CI:类型 + 测试 + 生成项目 E2E 冒烟(不装 dsh 宿主,只验证「生成的工程能装依赖/过类型/构建」)
# 冒烟覆盖四条生成面:预设组合 / 精选案例 / 自由组合 / MCP server 产出的工程
# 直连 push 与 PR 都触发(本仓库不走 PR 流程,push 触发是主通路)
name: CI

on: [push, pull_request]

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  e2e-smoke:
    name: generate-and-build smoke (${{ matrix.track }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        track: [latest, next] # 双轨各跑一遍;轨的版本配套由各自 manifest 单源决定
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # 三路生成:预设组合(tool)+ 精选案例(quick-tool,含 UI 卡片走 CSS 内联管线)+ 自由组合
      # (自由组合是 CLI 的非交互入口:给能力类 flag 即走,不经问卷;tool+ui 两原子 + settings-card 界面位)
      - name: scaffold preset (tool)
        run: node dist/cli.mjs create preset-tool --template tool --lang en --target ${{ matrix.track }}
      - name: scaffold curated case (quick-tool)
        run: node dist/cli.mjs create case-qt --template quick-tool -s --lang en --target ${{ matrix.track }}
      - name: scaffold free combination (tool + ui)
        run: >
          node dist/cli.mjs create free-combo
          --atoms tool,ui
          --ui-surfaces settings-card
          --config dynamic
          --tool-name query_orders
          --lang en
          --target ${{ matrix.track }}

      # MCP 路径:真起 stdio server,逐个调三个 tool(新表面不测 = 不知道提交后还行不行)
      - name: MCP smoke (stdio server + three tools)
        run: node scripts/mcp-smoke.mjs mcp-smoke ${{ matrix.track }}

      # 生成工程三步验证;生成项目自带 pnpm-workspace.yaml 定界(防祖先 workspace 劫持),勿加 --ignore-workspace
      - name: preset-tool install / typecheck / build
        run: |
          cd preset-tool
          pnpm install
          pnpm typecheck
          pnpm build
      - name: case-qt install / typecheck / build
        run: |
          cd case-qt
          pnpm install
          pnpm typecheck
          pnpm build
      - name: free-combo install / typecheck / build
        run: |
          cd free-combo
          pnpm install
          pnpm typecheck
          pnpm build
      - name: mcp-free install / typecheck / build
        run: |
          cd mcp-smoke/tool-side/mcp-free
          pnpm install
          pnpm typecheck
          pnpm build
      # 访谈流程(spec → CLI 参数)产出的工程也要能装能编译
      - name: spec-free install / typecheck / build
        run: |
          cd mcp-smoke/tool-side/spec-free
          pnpm install
          pnpm typecheck
          pnpm build
