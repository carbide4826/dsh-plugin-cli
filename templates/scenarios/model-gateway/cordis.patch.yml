# 分发配置层:本插件在 profile 中的注册行(dsh plugin --profile <name> add ./ 后生效)。
# 注意:patch 按 id 定位并整行替换 config,不做合并。
- insert:
    - id: model-gateway
      name: 'model-gateway'
      config:
        # 只放环境变量名,不放 key 本身(官方 apiKeyEnv 同款,key 不落盘)
        apiKeyEnv: GATEWAY_API_KEY
        baseUrl: 'https://gateway.example.com/v1'
        model: 'gateway-chat'
